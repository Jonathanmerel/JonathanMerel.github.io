<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080810"/>
      <stop offset="100%" style="stop-color:#0c0e1a"/>
    </linearGradient>
    <linearGradient id="gLow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00cc66"/>
    </linearGradient>
    <linearGradient id="gMed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffc800"/>
      <stop offset="100%" style="stop-color:#ff9900"/>
    </linearGradient>
    <linearGradient id="gHigh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#cc2222"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00c2ff;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowG">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowB">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="rgba(0,255,136,0.08)"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- Subtle glow orbs -->
  <ellipse cx="200" cy="225" rx="220" ry="180" fill="rgba(0,255,136,0.03)"/>
  <ellipse cx="620" cy="200" rx="200" ry="160" fill="rgba(0,194,255,0.04)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="800" height="2" fill="url(#gLow)" opacity="0.5"/>

  <!-- ════════════════════════════════
       LEFT — Gauge / Score principal
  ════════════════════════════════ -->

  <!-- Gauge background arc (semicircle) -->
  <!-- Track -->
  <path d="M 100 280 A 130 130 0 0 1 360 280" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="18" stroke-linecap="round"/>

  <!-- HIGH zone (rojo) -->
  <path d="M 100 280 A 130 130 0 0 1 187 168" fill="none" stroke="#ff4444" stroke-width="18" stroke-linecap="round" opacity="0.25"/>
  <!-- MED zone (amarillo) -->
  <path d="M 187 168 A 130 130 0 0 1 273 168" fill="none" stroke="#ffc800" stroke-width="18" stroke-linecap="round" opacity="0.25"/>
  <!-- LOW zone (verde) -->
  <path d="M 273 168 A 130 130 0 0 1 360 280" fill="none" stroke="#00ff88" stroke-width="18" stroke-linecap="round" opacity="0.25"/>

  <!-- Needle indicator — apuntando a zona HIGH -->
  <!-- pivot = 230, 280 -->
  <line x1="230" y1="280" x2="128" y2="195" stroke="#ff4444" stroke-width="3" stroke-linecap="round" filter="url(#glowG)" opacity="0.9"/>
  <!-- pivot circle -->
  <circle cx="230" cy="280" r="10" fill="#0c0e1a" stroke="#ff4444" stroke-width="2"/>
  <circle cx="230" cy="280" r="4" fill="#ff4444" filter="url(#glowG)"/>

  <!-- Zone labels -->
  <text x="104" y="308" font-family="'Courier New',monospace" font-size="10" fill="#ff4444" opacity="0.9" font-weight="bold">HIGH</text>
  <text x="210" y="168" font-family="'Courier New',monospace" font-size="10" fill="#ffc800" opacity="0.9" font-weight="bold">MED</text>
  <text x="320" y="308" font-family="'Courier New',monospace" font-size="10" fill="#00ff88" opacity="0.9" font-weight="bold">LOW</text>

  <!-- Score value -->
  <text x="230" y="250" font-family="'Courier New',monospace" font-size="40" font-weight="bold" fill="#ff4444" text-anchor="middle" filter="url(#glowG)">0.84</text>
  <text x="230" y="268" font-family="'Courier New',monospace" font-size="10" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="2">RISK SCORE</text>

  <!-- Label badge -->
  <rect x="171" y="298" width="118" height="26" rx="5" fill="rgba(255,68,68,0.12)" stroke="rgba(255,68,68,0.4)" stroke-width="1"/>
  <circle cx="190" cy="311" r="4" fill="#ff4444" filter="url(#glowG)"/>
  <text x="232" y="316" font-family="'Courier New',monospace" font-size="12" fill="#ff4444" text-anchor="middle" font-weight="bold">● HIGH RISK</text>

  <!-- Tiny features below gauge -->
  <text x="78" y="355" font-family="'Courier New',monospace" font-size="8.5" fill="rgba(255,255,255,0.3)" letter-spacing="1.5">FEATURES CLAVE</text>

  <!-- feat rows -->
  <!-- debt_to_income -->
  <text x="78" y="373" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.45)">debt_to_income</text>
  <rect x="190" y="363" width="170" height="7" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="190" y="363" width="152" height="7" rx="2" fill="rgba(255,68,68,0.55)"/>
  <text x="368" y="371" font-family="'Courier New',monospace" font-size="8" fill="#ff4444">0.89</text>

  <!-- credit_score -->
  <text x="78" y="390" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.45)">credit_score</text>
  <rect x="190" y="380" width="170" height="7" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="190" y="380" width="68" height="7" rx="2" fill="rgba(0,194,255,0.55)"/>
  <text x="368" y="388" font-family="'Courier New',monospace" font-size="8" fill="#00c2ff">0.40</text>

  <!-- missed_payments -->
  <text x="78" y="407" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.45)">missed_pmts</text>
  <rect x="190" y="397" width="170" height="7" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="190" y="397" width="128" height="7" rx="2" fill="rgba(255,200,0,0.55)"/>
  <text x="368" y="405" font-family="'Courier New',monospace" font-size="8" fill="#ffc800">0.75</text>

  <!-- ════════════════════════════════
       DIVIDER
  ════════════════════════════════ -->
  <line x1="420" y1="30" x2="420" y2="420" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- ════════════════════════════════
       RIGHT — Distribution chart + model info
  ════════════════════════════════ -->

  <!-- Title -->
  <text x="450" y="62" font-family="'Courier New',monospace" font-size="9" fill="#00c2ff" letter-spacing="2" opacity="0.8">// DISTRIBUCIÓN DEL DATASET</text>

  <!-- Bar chart — distribución de clases -->
  <!-- Axes -->
  <line x1="470" y1="80" x2="470" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="470" y1="220" x2="760" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="470" y1="160" x2="760" y2="160" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="470" y1="120" x2="760" y2="120" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Y labels -->
  <text x="454" y="224" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.25)" text-anchor="end">0</text>
  <text x="454" y="164" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.25)" text-anchor="end">50%</text>
  <text x="454" y="124" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.25)" text-anchor="end">75%</text>

  <!-- LOW bar -->
  <rect x="500" y="115" width="60" height="105" rx="3" fill="url(#gLow)" opacity="0.75" filter="url(#glowG)"/>
  <text x="530" y="232" font-family="'Courier New',monospace" font-size="9" fill="#00ff88" text-anchor="middle">LOW</text>
  <text x="530" y="110" font-family="'Courier New',monospace" font-size="9" fill="#00ff88" text-anchor="middle">52%</text>

  <!-- MED bar -->
  <rect x="595" y="148" width="60" height="72" rx="3" fill="url(#gMed)" opacity="0.75"/>
  <text x="625" y="232" font-family="'Courier New',monospace" font-size="9" fill="#ffc800" text-anchor="middle">MED</text>
  <text x="625" y="143" font-family="'Courier New',monospace" font-size="9" fill="#ffc800" text-anchor="middle">36%</text>

  <!-- HIGH bar -->
  <rect x="690" y="184" width="60" height="36" rx="3" fill="url(#gHigh)" opacity="0.75"/>
  <text x="720" y="232" font-family="'Courier New',monospace" font-size="9" fill="#ff4444" text-anchor="middle">HIGH</text>
  <text x="720" y="179" font-family="'Courier New',monospace" font-size="9" fill="#ff4444" text-anchor="middle">18%</text>

  <!-- Divider -->
  <line x1="440" y1="248" x2="780" y2="248" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Model metrics -->
  <text x="450" y="272" font-family="'Courier New',monospace" font-size="9" fill="rgba(255,255,255,0.3)" letter-spacing="2">MODEL METRICS</text>

  <!-- Metric cards -->
  <!-- Accuracy -->
  <rect x="450" y="282" width="95" height="54" rx="6" fill="rgba(0,255,136,0.05)" stroke="rgba(0,255,136,0.12)" stroke-width="1"/>
  <text x="497" y="302" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">ACCURACY</text>
  <text x="497" y="324" font-family="'Courier New',monospace" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle" filter="url(#glowG)">91%</text>

  <!-- F1 Score -->
  <rect x="555" y="282" width="95" height="54" rx="6" fill="rgba(0,194,255,0.05)" stroke="rgba(0,194,255,0.12)" stroke-width="1"/>
  <text x="602" y="302" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">F1-SCORE</text>
  <text x="602" y="324" font-family="'Courier New',monospace" font-size="20" font-weight="bold" fill="#00c2ff" text-anchor="middle" filter="url(#glowB)">0.89</text>

  <!-- AUC -->
  <rect x="660" y="282" width="95" height="54" rx="6" fill="rgba(255,200,0,0.05)" stroke="rgba(255,200,0,0.12)" stroke-width="1"/>
  <text x="707" y="302" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">ROC-AUC</text>
  <text x="707" y="324" font-family="'Courier New',monospace" font-size="20" font-weight="bold" fill="#ffc800" text-anchor="middle">0.94</text>

  <!-- Divider -->
  <line x1="440" y1="352" x2="780" y2="352" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Stack badges -->
  <text x="450" y="373" font-family="'Courier New',monospace" font-size="9" fill="rgba(255,255,255,0.3)" letter-spacing="2">STACK</text>

  <rect x="450" y="382" width="68" height="18" rx="4" fill="rgba(0,255,136,0.07)" stroke="rgba(0,255,136,0.18)" stroke-width="1"/>
  <text x="484" y="395" font-family="'Courier New',monospace" font-size="8" fill="#00ff88" text-anchor="middle">Scikit-learn</text>

  <rect x="526" y="382" width="52" height="18" rx="4" fill="rgba(0,194,255,0.07)" stroke="rgba(0,194,255,0.18)" stroke-width="1"/>
  <text x="552" y="395" font-family="'Courier New',monospace" font-size="8" fill="#00c2ff" text-anchor="middle">Pandas</text>

  <rect x="586" y="382" width="44" height="18" rx="4" fill="rgba(255,200,0,0.07)" stroke="rgba(255,200,0,0.18)" stroke-width="1"/>
  <text x="608" y="395" font-family="'Courier New',monospace" font-size="8" fill="#ffc800" text-anchor="middle">SMOTE</text>

  <rect x="638" y="382" width="54" height="18" rx="4" fill="rgba(0,255,136,0.07)" stroke="rgba(0,255,136,0.18)" stroke-width="1"/>
  <text x="665" y="395" font-family="'Courier New',monospace" font-size="8" fill="#00ff88" text-anchor="middle">FastAPI</text>

  <rect x="700" y="382" width="58" height="18" rx="4" fill="rgba(0,194,255,0.07)" stroke="rgba(0,194,255,0.18)" stroke-width="1"/>
  <text x="729" y="395" font-family="'Courier New',monospace" font-size="8" fill="#00c2ff" text-anchor="middle">PostgreSQL</text>

  <!-- Model name bottom -->
  <text x="450" y="425" font-family="'Courier New',monospace" font-size="9" fill="rgba(255,255,255,0.2)">GradientBoostingClassifier · v1.0.0 · 8000 samples</text>

  <!-- LEFT bottom label -->
  <text x="78" y="430" font-family="'Courier New',monospace" font-size="9" fill="rgba(255,255,255,0.2)">GBM · 3-class · SMOTE balanced</text>
</svg>
